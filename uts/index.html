<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b16" />
    <title>VOIDFLEET — Space Fleet Multiplier</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%237af5dc' d='M20 2 36 35 20 27 4 35Z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="world" aria-label="Arena game 3D Voidfleet"></canvas>
    <div class="vignette"></div>
    <header>
      <a class="brand" href="./">VOIDFLEET</a>
      <button id="sound" class="icon-button" aria-label="Aktifkan suara">SOUND OFF</button>
    </header>
    <main>
      <section id="briefing" class="briefing">
        <button id="launch" class="primary" disabled><span>Loading…</span><span aria-hidden="true">▶</span></button>
        <div id="load-status" class="launch-note" role="status">Loading ships…</div>
      </section>
      <div id="hud" class="hidden">
        <div class="fleet-readout">
          <span class="eyebrow">FLEET</span
          ><strong id="fleet">08</strong>
        </div>
        <div class="route">
          <div>
            <span id="sector">01 / GATE RUN</span><span id="distance">0%</span>
          </div>
          <div class="progress"><i id="progress"></i></div>
        </div>
        <button id="pause" class="icon-button">Ⅱ PAUSE</button>
      </div>
      <div id="toast" role="status"></div>
      <div id="boss-bar" class="hidden">
        <div>
          <span>HOSTILE / DREADNOUGHT</span
          ><strong id="boss-value">100%</strong>
        </div>
        <div class="progress"><i id="boss-health"></i></div>
      </div>
      <div id="pulse-hud" class="hidden">
        <button id="pulse"><span>PULSE READY</span><kbd>SPACE</kbd></button
        ><span></span>
      </div>
      <section id="result" class="overlay hidden">
        <div class="result-card">
          <div class="eyebrow" id="result-label">MISSION DEBRIEF</div>
          <h2 id="result-title"></h2>
          <p id="result-copy"></p>
          <div class="result-stats">
            <span>SHIPS REMAINING<strong id="result-fleet"></strong></span
            ><span>THREATS DESTROYED<strong id="result-kills"></strong></span>
          </div>
          <button id="restart" class="primary">
            DEPLOY AGAIN <span>↗</span>
          </button>
        </div>
      </section>
      <section id="pause-overlay" class="overlay hidden">
        <div class="result-card">
          <div class="eyebrow">FLIGHT SYSTEMS ON HOLD</div>
          <h2>Take a breath.</h2>
          <p>Misi lo menunggu.</p>
          <button id="resume" class="primary">
            RESUME FLIGHT <span>↗</span>
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
